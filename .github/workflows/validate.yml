name: Validate site sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The README is the source of truth; docs/ must be regenerated to match.
      - name: Check README and docs/ are in sync
        run: node scripts/build.mjs --check
